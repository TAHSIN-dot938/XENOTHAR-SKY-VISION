name: Build Android pack

on:
  workflow_dispatch:
  push:
    paths:
      - "src/newb/pack_config.toml"
      - "src/newb/config.h"
      - ".github/workflows/build-android.yml"
      - "tools/patch_upstream_sky.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XENOTHAR project
        uses: actions/checkout@v4
      - name: Checkout upstream shader source
        uses: actions/checkout@v4
        with:
          repository: devendrn/newb-x-mcbe
          ref: 13e9c87749855cba8da7e381edaf586b9c8fd01f
          path: upstream
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        working-directory: upstream
        run: python -m pip install -r requirements.txt
      - name: Configure branded pack
        run: |
          cp src/newb/pack_config.toml upstream/src/newb/pack_config.toml
          cp src/newb/config.h upstream/src/newb/config.h
          python -m pip install pillow
          python tools/patch_upstream_sky.py
      - name: Set up upstream build environment
        working-directory: upstream
        run: chmod +x build.sh && ./build.sh setup
      - name: Build Android resource pack
        working-directory: upstream
        run: ./build.sh pack -p android -v 3
      - name: Normalize pack manifest version
        working-directory: upstream
        run: |
          python - <<'PY'
          import glob, json, os, tempfile, zipfile
          for path in glob.glob("build/*.mcpack"):
              with zipfile.ZipFile(path, "r") as src:
                  entries = [(item, src.read(item.filename)) for item in src.infolist()]
              output = path + ".tmp"
              with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as dst:
                  for info, data in entries:
                      if info.filename == "manifest.json":
                          manifest = json.loads(data.decode("utf-8"))
                          manifest["header"]["version"] = [2, 4, 0]
                          for module in manifest.get("modules", []):
                              module["version"] = [2, 3, 4]
                          data = json.dumps(manifest, indent=2).encode("utf-8")
                      dst.writestr(info, data)
              os.replace(output, path)
          PY
      - name: Upload mcpack
        uses: actions/upload-artifact@v4
        with:
          name: XENOTHAR-SKY-VISION-Android
          path: upstream/build/*.mcpack
          if-no-files-found: error
          retention-days: 14
